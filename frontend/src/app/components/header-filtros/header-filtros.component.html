<header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-col md:flex-row justify-between items-center shadow-sm">
  <!-- Título o sección actual -->
  <div class="mb-4 md:mb-0">
    <h2 class="text-xl font-bold text-tirme-dark">Panel de Control RRHH</h2>
    <p class="text-xs text-slate-500">Filtrando datos corporativos en tiempo real</p>
  </div>

  <!-- Desplegables de Filtros Globales -->
  <div class="flex flex-wrap items-center gap-3">
    <!-- Año -->
    <div class="flex flex-col">
      <label class="text-xs font-semibold text-slate-600 mb-1">Año</label>
      <select 
        [value]="filtrosService.filtros().anio" 
        (change)="onAnioChange($event)"
        class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-tirme-green focus:border-tirme-green block p-2">
        <option [value]="2026">2026</option>
        <option [value]="2025">2025</option>
        <option [value]="2024">2024</option>
      </select>
    </div>

    <!-- Dirección -->
    <div class="flex flex-col">
      <label class="text-xs font-semibold text-slate-600 mb-1">Dirección</label>
      <select 
        [value]="filtrosService.filtros().direccion" 
        (change)="onDireccionChange($event)"
        class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-tirme-green focus:border-tirme-green block p-2">
        <option value="TODAS">Todas las Direcciones</option>
        <option value="OPERACIONES">Operaciones</option>
        <option value="TECNOLOGIA">Tecnología y Sistemas</option>
        <option value="CORPORATIVO">Corporativo</option>
      </select>
    </div>

    <!-- Grupo -->
    <div class="flex flex-col">
      <label class="text-xs font-semibold text-slate-600 mb-1">Grupo</label>
      <select 
        [value]="filtrosService.filtros().grupo" 
        (change)="onGrupoChange($event)"
        class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-tirme-green focus:border-tirme-green block p-2">
        <option value="TODOS">Todos los Grupos</option>
        <option value="PLANTA">Planta</option>
        <option value="OFICINAS">Oficinas Centrales</option>
        <option value="MANTENIMIENTO">Mantenimiento</option>
      </select>
    </div>

    <!-- Estado -->
    <div class="flex flex-col">
      <label class="text-xs font-semibold text-slate-600 mb-1">Estado</label>
      <select 
        [value]="filtrosService.filtros().estado" 
        (change)="onEstadoChange($event)"
        class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-tirme-green focus:border-tirme-green block p-2">
        <option value="TODOS">Todos</option>
        <option value="ACTIVO">Activos</option>
        <option value="BAJA">Baja</option>
      </select>
    </div>
  </div>
</header>
