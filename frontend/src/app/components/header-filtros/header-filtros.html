<header
  class="bg-white border-b border-slate-200 px-6 py-4 flex flex-col lg:flex-row items-center justify-between shadow-sm gap-4"
>
  <!-- Título de la sección o bienvenida -->
  <div>
    <h2 class="text-xl font-bold text-slate-800 tracking-tight">Panel de Control RRHH</h2>
    <p class="text-xs text-slate-500">Filtros globales aplicados a todo el cuadro de mando</p>
  </div>

  <!-- Controles de Filtros Globales -->
  <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto justify-end">
    <!-- Filtro de Año -->
    <div class="flex flex-col">
      <label class="text-[11px] font-semibold text-slate-600 mb-1">Año</label>
      <select
        (change)="onAnioChange($event)"
        class="bg-slate-50 border border-slate-300 text-slate-700 text-xs rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block px-3 py-2"
      >
        <option [value]="2026">2026</option>
        <option [value]="2025">2025</option>
        <option [value]="2024">2024</option>
      </select>
    </div>

    <!-- Filtro de Dirección -->
    <div class="flex flex-col">
      <label class="text-[11px] font-semibold text-slate-600 mb-1">Dirección</label>
      <select
        (change)="onDireccionChange($event)"
        class="bg-slate-50 border border-slate-300 text-slate-700 text-xs rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block px-3 py-2"
      >
        <option value="">Todas las Direcciones</option>
        <option value="Operaciones">Operaciones</option>
        <option value="Administración">Administración</option>
        <option value="Planta">Planta</option>
      </select>
    </div>

    <!-- Filtro de Grupo -->
    <div class="flex flex-col">
      <label class="text-[11px] font-semibold text-slate-600 mb-1">Grupo</label>
      <select
        (change)="onGrupoChange($event)"
        class="bg-slate-50 border border-slate-300 text-slate-700 text-xs rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block px-3 py-2"
      >
        <option value="">Todos los Grupos</option>
        <option value="Turno A">Turno A</option>
        <option value="Turno B">Turno B</option>
        <option value="Oficinas">Oficinas</option>
      </select>
    </div>

    <!-- Filtro de Estado -->
    <div class="flex flex-col">
      <label class="text-[11px] font-semibold text-slate-600 mb-1">Estado</label>
      <select
        (change)="onEstadoChange($event)"
        class="bg-slate-50 border border-slate-300 text-slate-700 text-xs rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block px-3 py-2"
      >
        <option value="">Todos los Estados</option>
        <option value="Activo">Activo</option>
        <option value="De baja">De baja</option>
        <option value="Vacaciones">Vacaciones</option>
      </select>
    </div>
  </div>
</header>
